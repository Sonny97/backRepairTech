name: Backend Tests - Jest

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop, master, main, release/*]

jobs:
  backend-tests:
    name: Run Backend Tests (Jest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Run Backend Tests
        run: npm test -- --forceExit 2>&1 | tee backend-test-output.txt
        continue-on-error: true

      - name: Run Backend Tests with Coverage
        run: npm run test:coverage -- --forceExit 2>&1 | tee backend-coverage-output.txt
        continue-on-error: true

      - name: Generate test report
        if: always()
        run: |
          mkdir -p reports
          echo "<html><head><title>Backend Test Report</title>" > reports/report.html
          echo "<style>body{font-family:Arial;padding:20px} pre{background:#f4f4f4;padding:10px;overflow-x:auto}</style>" >> reports/report.html
          echo "</head><body><h1>RepairTech Backend - Test Results</h1>" >> reports/report.html
          echo "<h2>$(date)</h2>" >> reports/report.html
          echo "<h3>Summary</h3><pre>" >> reports/report.html
          grep -E "Test Suites|Tests:|passed|failed" backend-test-output.txt 2>/dev/null | tail -5 >> reports/report.html || echo "N/A" >> reports/report.html
          echo "</pre><h3>Coverage</h3><pre>" >> reports/report.html
          grep -E "All files|% Stmts|% Branch|% Funcs|% Lines" backend-coverage-output.txt 2>/dev/null | tail -10 >> reports/report.html || echo "N/A" >> reports/report.html
          echo "</pre></body></html>" >> reports/report.html

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports-${{ github.run_number }}
          path: |
            reports/
            backend-test-output.txt
            backend-coverage-output.txt
          retention-days: 30

      - name: Test Summary
        if: always()
        run: |
          echo "## Backend Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          SUITES=$(grep -oP "Test Suites: \K\d+" backend-test-output.txt 2>/dev/null | head -1 || echo "N/A")
          TESTS=$(grep -oP "Tests: \K\d+" backend-test-output.txt 2>/dev/null | head -1 || echo "N/A")
          PASSED=$(grep -oP "passed, \K\d+" backend-test-output.txt 2>/dev/null | head -1 || echo "N/A")
          FAILED=$(grep -oP ", \d+ failed" backend-test-output.txt 2>/dev/null | grep -oP "\d+" | head -1 || echo "0")
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suites | ${SUITES} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ${TESTS} |" >> $GITHUB_STEP_SUMMARY
          echo "| Passed | ${PASSED} |" >> $GITHUB_STEP_SUMMARY
          echo "| Failed | ${FAILED} |" >> $GITHUB_STEP_SUMMARY
