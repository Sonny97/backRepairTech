name: Branch Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop, master]

jobs:
  branch-check:
    name: Branch Name Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get branch info
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          echo "BRANCH_NAME=$BRANCH_NAME"
          echo "Target branch: ${{ github.base_ref }}"
          echo "PR: ${{ github.event_name }}"

      - name: Check branch name conventions
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          ALLOWED_PREFIXES="^feature/|^feat/|^hotfix/|^refactor/|^release/"

          if echo "$BRANCH_NAME" | grep -Eq "$ALLOWED_PREFIXES"; then
            echo "✅ Branch '$BRANCH_NAME' follows conventions"
          else
            echo "❌ Branch '$BRANCH_NAME' not allowed to merge into ${{ github.base_ref }}"
            echo "   Allowed: feature/*, feat/*, hotfix/*, refactor/*, release/*"
            exit 1
          fi

      - name: Commit info
        run: |
          echo "Last 3 commits:"
          git log --oneline -3
