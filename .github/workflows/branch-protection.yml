name: Branch Check

on:
  push:
    branches:
      - develop
      - release/**
      - master
      - main
  pull_request:
    branches:
      - develop
      - release/**
      - master
      - main

jobs:
  branch-check:
    name: Branch Name Check
    runs-on: ubuntu-latest
    steps:
      - name: Get branch name
        id: branch
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH_NAME="${{ github.head_ref }}"
          else
            BRANCH_NAME="${{ github.ref_name }}"
          fi
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
          echo "Branch: $BRANCH_NAME"
          echo "Event: ${{ github.event_name }}"

      - name: Check branch name
        run: |
          BRANCH_NAME="${{ env.BRANCH_NAME }}"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ALLOWED_PREFIXES="^feature/|^feat/|^hotfix/|^refactor/|^release/|^fix/"

            if echo "$BRANCH_NAME" | grep -Eq "$ALLOWED_PREFIXES"; then
              echo "✅ Branch name '$BRANCH_NAME' follows conventions"
            else
              echo "⚠️  WARNING: Branch name '$BRANCH_NAME' does not follow conventional patterns"
              echo ""
              echo "Recommended branch names:"
              echo "  - feature/*    (new features)"
              echo "  - feat/*       (short for feature)"
              echo "  - hotfix/*     (urgent fixes)"
              echo "  - fix/*        (bug fixes)"
              echo "  - refactor/*   (code refactoring)"
              echo "  - release/*    (release branches)"
              echo ""
              echo "Your branch will still be processed."
            fi
          else
            echo "📝 Push to branch: $BRANCH_NAME"
            echo "If this is a protected branch, consider using a Pull Request next time."
          fi

      - name: Commit message info
        if: github.event_name == 'pull_request'
        run: |
          echo "Last 5 commits on this branch:"
          git log --oneline -5
          echo ""
          echo "Recommended commit message format:"
          echo "  feat: add new feature"
          echo "  fix: resolve bug"
          echo "  docs: update documentation"
          echo "  refactor: restructure code"
