name: Backend Tests - Jest

# Se ejecuta en PRs (merge) hacia develop o master, solo si la rama origen es una permitida.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [develop, master]

jobs:
  backend-tests:
    name: Run Backend Tests (Jest)
    if: >-
      startsWith(github.head_ref, 'release/') ||
      startsWith(github.head_ref, 'feature/') ||
      startsWith(github.head_ref, 'feat/') ||
      startsWith(github.head_ref, 'hotfix/') ||
      startsWith(github.head_ref, 'refactor/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Install report generators
        run: npm install --no-save --legacy-peer-deps jest-junit jest-html-reporter

      - name: Run Backend Tests (with coverage)
        run: |
          mkdir -p reports
          npx jest --coverage --forceExit --ci \
            --json --outputFile=reports/results.json \
            --reporters=default \
            --reporters=jest-junit \
            --reporters=jest-html-reporter 2>&1 | tee reports/backend-test-output.txt
        env:
          JEST_JUNIT_OUTPUT_DIR: reports
          JEST_JUNIT_OUTPUT_NAME: junit.xml
          JEST_HTML_REPORTER_OUTPUT_PATH: reports/report.html
          JEST_HTML_REPORTER_PAGE_TITLE: RepairTech Backend - Test Report
          JEST_HTML_REPORTER_INCLUDE_FAILURE_MSG: 'true'

      - name: Test Summary
        if: always()
        run: |
          node -e '
          const fs = require("fs");
          const out = process.env.GITHUB_STEP_SUMMARY;
          let md = "## Backend Test Results\n\n";
          try {
            const r = JSON.parse(fs.readFileSync("reports/results.json", "utf8"));
            md += `**${r.success ? "✅ PASSED" : "❌ FAILED"}**\n\n`;
            md += "| Metric | Value |\n|---|---|\n";
            md += `| Test Suites | ${r.numPassedTestSuites}/${r.numTotalTestSuites} passed |\n`;
            md += `| Tests | ${r.numTotalTests} |\n| Passed | ${r.numPassedTests} |\n| Failed | ${r.numFailedTests} |\n| Skipped | ${r.numPendingTests} |\n\n`;
            md += "### Per suite\n\n| Suite | Status | Passed | Failed |\n|---|---|---|---|\n";
            for (const s of r.testResults) {
              const p = s.assertionResults.filter(t => t.status === "passed").length;
              const f = s.assertionResults.filter(t => t.status === "failed").length;
              md += `| ${s.name.split("/tests/").pop()} | ${s.status === "passed" ? "✅" : "❌"} | ${p} | ${f} |\n`;
            }
            const failed = r.testResults.flatMap(s => s.assertionResults.filter(t => t.status === "failed"));
            if (failed.length) {
              md += "\n### Failed tests\n\n";
              for (const t of failed) md += `- ❌ ${t.fullName}\n`;
            }
          } catch (e) { md += "No se generó reports/results.json (las pruebas no llegaron a ejecutarse).\n"; }
          try {
            const c = fs.readFileSync("reports/backend-test-output.txt", "utf8").match(/^(Statements|Branches|Functions|Lines)\s*:.*$/gm);
            if (c) md += "\n### Coverage\n\n```\n" + c.join("\n") + "\n```\n";
          } catch (e) {}
          fs.appendFileSync(out, md);
          '

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports-${{ github.run_number }}
          path: |
            reports/
            coverage/
          retention-days: 30
